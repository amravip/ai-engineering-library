name: website

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Builds the reader website without the generated book pages (website/.gitignore).
    # The site must show its honest "reading online is not available yet" state here.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Check internal links and anchors
        run: npm run check:links

      - name: Check page metadata, headings and sitemap
        run: npm run check:meta
