name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      # Any stray model call goes to a closed port and fails, instead of reaching a live model.
      OLLAMA_BASE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check repository layout and wording
        run: python tools/check_repo.py

      - name: Install ruff
        run: python -m pip install ruff==0.17.3

      - name: Lint code and tools
        run: python -m ruff check pizza-bot tools

      - name: Compile all Python files
        run: python -m compileall -q pizza-bot tools

      - name: Install test dependencies
        run: python -m pip install -r pizza-bot/requirements-dev.txt

      - name: Test each step
        shell: bash
        run: |
          for dir in pizza-bot/[0-9][0-9]-*/; do
            echo "::group::pytest in $dir"
            (cd "$dir" && python -m pytest -q)
            echo "::endgroup::"
          done

      - name: Test exercises
        shell: bash
        run: |
          for dir in pizza-bot/exercises/*/; do
            echo "::group::pytest in $dir"
            (cd "$dir" && python -m pytest -q)
            echo "::endgroup::"
          done
